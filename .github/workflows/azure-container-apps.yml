name: Deploy elderdragon

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to the registry
        run: az acr login --name elderdragonvip

      - name: Build and push
        run: |
          IMAGE="elderdragonvip.azurecr.io/elderdragon:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy the image
        run: |
          az containerapp update \
            --name elderdragon \
            --resource-group elderdragon \
            --image "$IMAGE" \
            --min-replicas 1 \
            --max-replicas 1 \
            --cpu 1.0 \
            --memory 2.0Gi \
            --set-env-vars \
              XAI_API_KEY=secretref:xai-api-key \
              CARDSIGHT_API_KEY=secretref:cardsight-api-key \
              AZURE_VISION_KEY=secretref:azure-vision-key \
              AZURE_VISION_ENDPOINT=secretref:azure-vision-endpoint
