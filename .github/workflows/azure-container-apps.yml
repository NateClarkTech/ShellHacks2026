name: Deploy elderdragon

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: elderdragonvip
          containerAppName: elderdragon
          resourceGroup: elderdragon
          targetPort: 8000
          ingress: external

      - name: Keep one warm replica and the keys
        run: |
          az containerapp update \
            --name elderdragon \
            --resource-group elderdragon \
            --min-replicas 1 \
            --max-replicas 1 \
            --cpu 1.0 \
            --memory 2.0Gi \
            --set-env-vars \
              XAI_API_KEY=secretref:xai-api-key \
              CARDSIGHT_API_KEY=secretref:cardsight-api-key \
              AZURE_VISION_KEY=secretref:azure-vision-key \
              AZURE_VISION_ENDPOINT=secretref:azure-vision-endpoint
